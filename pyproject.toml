[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bioseq-models"
version = "0.2.1"
description = "Checkpoint-backed activity models for bioseq-optimization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bioseq-optimization @ git+ssh://git@github.com/UTR-CODE/bioseq-optimization.git",
    "einops>=0.7",
    "lightgbm>=4",
    "numpy>=1.24,<3",
    "pandas>=2",
    "torch>=2.1",
    "tensorly>=0.8",
    "tensorly-torch>=0.5",
    "xgboost>=2",
]

[project.urls]
Repository = "https://github.com/UTR-CODE/bioseq-models"

[tool.setuptools.packages.find]
include = ["bioseq_models*"]

[tool.setuptools.package-data]
bioseq_models = ["checkpoints/*.pt", "checkpoints/*.json", "checkpoints/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
