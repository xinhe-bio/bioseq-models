[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bioseq-models"
version = "0.1.0"
description = "Checkpoint-backed activity models for bioseq-optimization"
requires-python = ">=3.10"
dependencies = [
    "bioseq-optimization @ git+ssh://git@github.com/UTR-CODE/bioseq-optimization.git",
    "numpy>=1.24,<3",
    "torch>=2.1",
    "tensorly>=0.8",
    "tensorly-torch>=0.5",
]

[tool.setuptools.packages.find]
include = ["bioseq_models*"]

[tool.setuptools.package-data]
bioseq_models = ["checkpoints/*.pt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
