[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bioseq-models"
version = "0.3.0"
description = "Ready-to-use checkpoint-backed biological sequence models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "einops>=0.7",
    "numpy>=1.24,<3",
    "packaging>=23",
    "torch>=2.1",
    "tensorly>=0.8",
    "tensorly-torch>=0.5",
    "xgboost>=2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.8"]

[project.urls]
Repository = "https://github.com/UTR-CODE/bioseq-models"

[tool.setuptools.packages.find]
include = ["bioseq_models*"]

[tool.setuptools.package-data]
bioseq_models = ["checkpoints/*.pt", "checkpoints/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
